name: Test Workflow

on:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    name: Download Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android bundle
        uses: ./
        with:
          script: flutter build appbundle --release --build-name=1.0.0 --build-number=20231005
          working-directory: counter

      - name: Build Web
        uses: ./
        with:
          script: flutter build web --release
          working-directory: counter

  build-test-mac:
    runs-on: macos-latest
    name: Download Test Mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS bundle
        uses: ./
        with:
          script: flutter build ios --release --build-name=1.0.0 --build-number=20231005
          working-directory: counter
