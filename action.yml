name: Flutter Build with Caching
description: Build Flutter project with caching of dependencies

inputs:
  flutter-version:
    description: The Flutter version to make available on the path
    required: false
    default: ""
  flutter-version-file:
    description: The pubspec.yaml file with exact Flutter version defined
    required: false
    default: ""
  working-directory:
    description: Working Directory
    default: .
  script:
    description: Custom Build Script
    required: false

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
        flutter-version: ${{ inputs.flutter-version }}
        flutter-version-file: ${{ inputs.flutter-version-file }}

    - name: Cache Project Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.PUB_CACHE }}
          **/.packages
          **/.flutter-plugins
          **/.flutter-plugin-dependencies
          **/.dart_tool/package_config.json
        key: deps-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: deps-

    - name: Run Custom Build Script
      run: ${{ inputs.script }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

branding:
  icon: package
  color: blue
